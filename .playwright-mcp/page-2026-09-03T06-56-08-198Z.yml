      - heading "ANAGHA KHUDE" [level=1] [ref=f2e15]
      - paragraph [ref=f2e16]: Urban Planning . Urban Design . Architecture
      - paragraph [ref=f2e17]: PLACES ARE NEVER JUST PLACES.
      - paragraph [ref=f2e18]: An urban planner, urban designer and architect working across planning, urban design and architecture, with an interest in how places evolve and how those changes shape everyday life.
      - paragraph [ref=f2e19]: With a Master of Urban Planning and Design from Monash University and professional experience in architecture, the work brings together spatial analysis, research and design across different scales — from landscapes, neighbourhoods and urban systems to streets, public spaces and buildings. Experience spans strategic planning, urban design, land use, development and architectural design, with projects exploring housing growth in Melton, productive landscapes in Koo Wee Rup, industrial transformation in Fishermans Bend, connectivity and employment in Sunshine North, and architectural environments across residential, commercial and institutional projects. The work is grounded in an interest in the relationship between people, place and the systems that shape them, bringing together strategic thinking and human-scale design to create places that can grow, adapt and retain their character.
      - paragraph [ref=f2e20]: Master of Urban Planning & Design · Bachelor of Architecture
