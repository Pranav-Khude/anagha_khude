    - generic [ref=f2e49]:
      - generic [ref=f2e50]: Approach
      - paragraph [ref=f2e51]: My approach brings together planning, spatial thinking and design to understand places, respond to people's needs and shape practical strategies for their future.
    - generic [ref=f2e52]:
      - generic [ref=f2e53]:
        - generic [ref=f2e54]: "01"
        - heading "Context" [level=3] [ref=f2e55]
        - paragraph [ref=f2e56]: Read the place before shaping it. I look at landscape, history, demographics, land use and development patterns to understand what makes each place unique and where opportunities for change exist.
      - generic [ref=f2e57]:
        - generic [ref=f2e58]: "02"
        - heading "People" [level=3] [ref=f2e59]
        - paragraph [ref=f2e60]: Plan for how people experience place. I consider housing, accessibility, community needs and liveability to create places that are inclusive, diverse and responsive to the people who use them.
      - generic [ref=f2e61]:
        - generic [ref=f2e62]: "03"
        - heading "Strategy" [level=3] [ref=f2e63]
        - paragraph [ref=f2e64]: Turn analysis into direction. I connect research and spatial analysis with planning policy, urban design and implementation to develop clear strategies that can guide growth and change.
      - generic [ref=f2e65]:
        - generic [ref=f2e66]: "04"
        - heading "Sustainability" [level=3] [ref=f2e67]
        - paragraph [ref=f2e68]: Design for long-term resilience. I consider environmental, social and economic factors to support places that can adapt to change while remaining liveable, connected and responsible.
