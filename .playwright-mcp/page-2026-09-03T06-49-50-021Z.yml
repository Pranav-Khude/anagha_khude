  - generic [ref=f1e48]:
    - generic [ref=f1e49]:
      - generic [ref=f1e50]: Approach
      - paragraph [ref=f1e51]: My approach brings together planning, spatial thinking and design to understand places, respond to people's needs and shape practical strategies for their future.
    - generic [ref=f1e52]:
      - generic [ref=f1e53]:
        - generic [ref=f1e54]: "01"
        - heading "Context" [level=3] [ref=f1e55]
        - paragraph [ref=f1e56]: Read the place before shaping it. I look at landscape, history, demographics, land use and development patterns to understand what makes each place unique and where opportunities for change exist.
      - generic [ref=f1e57]:
        - generic [ref=f1e58]: "02"
        - heading "People" [level=3] [ref=f1e59]
        - paragraph [ref=f1e60]: Plan for how people experience place. I consider housing, accessibility, community needs and liveability to create places that are inclusive, diverse and responsive to the people who use them.
      - generic [ref=f1e61]:
        - generic [ref=f1e62]: "03"
        - heading "Strategy" [level=3] [ref=f1e63]
        - paragraph [ref=f1e64]: Turn analysis into direction. I connect research and spatial analysis with planning policy, urban design and implementation to develop clear strategies that can guide growth and change.
      - generic [ref=f1e65]:
        - generic [ref=f1e66]: "04"
        - heading "Sustainability" [level=3] [ref=f1e67]
        - paragraph [ref=f1e68]: Design for long-term resilience. I consider environmental, social and economic factors to support places that can adapt to change while remaining liveable, connected and responsible.
  - generic [ref=f1e70]:
    - generic [ref=f1e71]:
      - generic [ref=f1e72]: About
      - heading "Background" [level=2] [ref=f1e73]
    - generic [ref=f1e74]:
      - generic [ref=f1e75]:
        - paragraph [ref=f1e76]: My work sits between architecture, urban planning and design, exploring how these different scales come together to shape everyday experiences. From designing a healthcare environment around nature, healing and sensory experience to studying growing towns, industrial landscapes and activity centres, I am interested in understanding what makes a place work and what allows it to evolve without losing its character.
        - paragraph [ref=f1e77]: I approach projects through research, observation, spatial analysis and design, moving from the larger systems of landscape, movement and economy to the details of buildings, materials, courtyards, streets and public spaces. My architectural work has particularly shaped my interest in human-scale environments, the relationship between nature and built form, and architecture as an experience rather than simply an object.
        - paragraph [ref=f1e78]: Across my work, agriculture becomes part of a town's structure, industry becomes an opportunity for renewal, landscape becomes infrastructure, and architecture becomes a way of shaping how people feel, move and interact with a place.
        - paragraph [ref=f1e79]: I am interested in the space between what a place is and what it could become.
