      - heading "ANAGHA KHUDE" [level=1] [ref=f1e15]
      - paragraph [ref=f1e16]: Urban Planning . Urban Design . Architecture
      - paragraph [ref=f1e17]: PLACES ARE NEVER JUST PLACES.
      - paragraph [ref=f1e18]: They are shaped by the people who use them, the landscapes that support them, the systems that connect them, and the spaces we create within them.
      - paragraph [ref=f1e19]: Urban Planner and Architect with a Master of Urban Planning and Design from Monash University, combining planning, spatial analysis and architectural experience across strategic planning, urban design, land-use planning and development assessment. Experienced in analysing planning controls, zoning, spatial and environmental data, preparing planning documentation and supporting multidisciplinary project teams across campus, residential, commercial and mixed-use projects.
      - paragraph [ref=f1e20]: Master of Urban Planning & Design · Bachelor of Architecture
