    - generic [ref=f9e52]:
      - generic [ref=f9e53]: Approach
      - paragraph [ref=f9e54]: My approach brings together planning, spatial thinking and design to understand places, respond to people's needs and shape practical strategies for their future.
    - generic [ref=f9e55]:
      - generic [ref=f9e56]:
        - generic [ref=f9e57]: "01"
        - heading "Context" [level=3] [ref=f9e58]
        - paragraph [ref=f9e59]: Read the place before shaping it. I look at landscape, history, demographics, land use and development patterns to understand what makes each place unique and where opportunities for change exist.
      - generic [ref=f9e60]:
        - generic [ref=f9e61]: "02"
        - heading "People" [level=3] [ref=f9e62]
        - paragraph [ref=f9e63]: Plan for how people experience place. I consider housing, accessibility, community needs and liveability to create places that are inclusive, diverse and responsive to the people who use them.
      - generic [ref=f9e64]:
        - generic [ref=f9e65]: "03"
        - heading "Strategy" [level=3] [ref=f9e66]
        - paragraph [ref=f9e67]: Turn analysis into direction. I connect research and spatial analysis with planning policy, urban design and implementation to develop clear strategies that can guide growth and change.
      - generic [ref=f9e68]:
        - generic [ref=f9e69]: "04"
        - heading "Sustainability" [level=3] [ref=f9e70]
        - paragraph [ref=f9e71]: Design for long-term resilience. I consider environmental, social and economic factors to support places that can adapt to change while remaining liveable, connected and responsible.
