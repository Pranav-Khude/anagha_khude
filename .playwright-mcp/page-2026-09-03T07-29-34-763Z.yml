    - heading "ANAGHA KHUDE" [level=1] [ref=f9e16]
    - generic [ref=f9e18]:
      - paragraph [ref=f9e19]: Urban Planning . Urban Design . Architecture
      - paragraph [ref=f9e20]: PLACES ARE NEVER JUST PLACES.
      - paragraph [ref=f9e21]: An urban planner and architect with a Master of Urban Planning and Design from Monash University and professional experience in architecture and urban design.
      - paragraph [ref=f9e22]: The work sits across planning and design, from understanding how a town, neighbourhood or precinct functions to considering the streets, public spaces and buildings that shape everyday experience. This includes work in strategic planning, urban design, land use, development and architectural design.
      - paragraph [ref=f9e23]: Past projects have explored housing growth in Melton, the relationship between agriculture and town structure in Koo Wee Rup, industrial change in Fishermans Bend, and employment, movement and neighbourhood connections in Sunshine North. Architectural experience across residential, commercial and institutional projects has also shaped an interest in how people experience spaces at a more human scale.
      - paragraph [ref=f9e24]: Across these different types of work, the focus is on understanding a place first, identifying what is working and what could change, and then using planning and design to develop a considered response.
      - paragraph [ref=f9e25]: Master of Urban Planning & Design · Bachelor of Architecture
