      - generic [ref=f1e80]:
        - paragraph [ref=f1e81]: With a foundation in architecture and postgraduate training in urban planning and design, my work sits at the intersection of built form, public space, policy and community.
        - paragraph [ref=f1e82]: I believe that great places are born from a deep understanding of context—its history, culture, ecology, and the people who inhabit it. My approach combines rigorous research with creative spatial design to shape environments that are not only functional but also meaningful and enduring.
        - paragraph [ref=f1e83]: Whether working on a city-wide strategic plan or a intimate public space, I bring the same level of care and attention to the relationship between buildings, streets, neighborhoods, and the broader urban fabric.
